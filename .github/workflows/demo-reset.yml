name: Reset nocturno de la demo

# Todas las noches (03:00 hora de Argentina = 06:00 UTC) deja los datos de ejemplo como nuevos.
# También despierta el servidor gratuito de Render.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de reset
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "$API_URL/internal/demo-reset" -H "X-Cron-Secret: $CRON_SECRET"
